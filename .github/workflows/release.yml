name: Release

on:
  # 只在推送版本标签时自动发布；推送到 main 不再触发
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "留空仅构建 Artifacts；填写已有版本标签则复用 Draft 并发布"
        required: false
        type: string

env:
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: release-${{ inputs.tag && format('tag-{0}', inputs.tag) || (github.event_name == 'push' && github.ref_type == 'tag' && format('tag-{0}', github.ref_name)) || format('artifact-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  create-draft-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      source_ref: ${{ steps.meta.outputs.source_ref }}
      tag: ${{ steps.meta.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_url: ${{ steps.release.outputs.release_url }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_body: ${{ steps.release.outputs.release_body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: meta
        name: 解析源码与发布通道
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          TAG=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          fi
          export TAG
          # 输入仅经环境变量传入，严格校验后才用于 Git 参数。
          node <<'NODE'
          const tag = process.env.TAG;
          const semver = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;
          if (tag && (!semver.test(tag) || /[\r\n]/.test(tag))) {
            console.error('标签必须是带 v 前缀的严格 SemVer');
            process.exit(1);
          }
          NODE

          SOURCE_REF="$GITHUB_SHA"
          PRERELEASE=false
          if [[ -n "$TAG" ]]; then
            git check-ref-format "refs/heads/$DEFAULT_BRANCH"
            git fetch origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            SOURCE_REF="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
            if ! git merge-base --is-ancestor "$SOURCE_REF" "refs/remotes/origin/$DEFAULT_BRANCH"; then
              echo "::error::标签提交不属于默认分支：$TAG"
              exit 1
            fi
            APP_VERSION="$(git show "$SOURCE_REF:src-tauri/tauri.conf.json" | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => console.log(JSON.parse(s).version))')"
            if [[ "v$APP_VERSION" != "$TAG" ]]; then
              echo "::error::标签 $TAG 与源码版本 v$APP_VERSION 不匹配"
              exit 1
            fi
            VERSION="${TAG#v}"
            VERSION="${VERSION%%+*}"
            [[ "$VERSION" != *-* ]] || PRERELEASE=true
          fi
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::源码引用必须是固定提交 SHA"
            exit 1
          fi
          git cat-file -e "$SOURCE_REF^{commit}"
          printf 'source_ref=%s\ntag=%s\nprerelease=%s\n' "$SOURCE_REF" "$TAG" "$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "源码：${SOURCE_REF}；标签：${TAG:-无，仅构建 Artifacts}；预发布：${PRERELEASE}"
          echo "本版本起桌面与服务器均发布 minisign 签名与 latest.json；旧签名密钥版本需手动安装一次；beta（预发布）不经 releases/latest 分发。macOS 使用自签名代码签名证书，computer-use 双向验签保留，未经 Apple 公证，首次打开可能出现 Gatekeeper 提示。SHA256 仅用于完整性校验，不是身份认证签名。"

      - id: release
        name: 创建或复用草稿发布
        if: steps.meta.outputs.tag != ''
        uses: actions/github-script@v7
        env:
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_REF: ${{ steps.meta.outputs.source_ref }}
        with:
          script: |
            const tag = process.env.TAG;
            const { owner, repo } = context.repo;
            const prerelease = process.env.PRERELEASE === "true";
            const releaseName = `BeeCode ${tag}`;
            const { data: commit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: process.env.SOURCE_REF,
            });

            const releaseBody = [
              commit.commit.message?.trim() || "无提交说明。",
              "## 免费安装包限制",
              "本发布不提供 Apple Developer ID 签名或 Apple 公证。macOS 使用仓库 Secrets 导入的自签名代码签名证书签名；该证书不在 Apple 信任链内，首次打开可能被 Gatekeeper 阻止，请仅在确认来源后手动允许。",
              "macOS 保留 computer-use：主程序、codeg-server 与 computer-helper 用同一张自签名证书做双向验签（按证书 SHA-1 指纹匹配），不回退到无验签模式。",
              "## 自动更新",
              "本版本起桌面与服务器均支持签名自动更新：桌面向 releases/latest/download/latest.json 查询，服务器下载 beecode-server-<os>-<arch>.tar.gz|.zip 并校验同名 .sig；缺签名或验签失败一律拒绝安装。",
              "BeeCode 已迁移至 EvanZheng11/beecode；v0.41.1 使用旧公钥的用户需手动下载安装一次 0.41.2，此后可获取新公钥验证的签名更新。",
              prerelease
                ? "本版本是 beta（预发布）：GitHub 的 releases/latest 只指向最新 stable，因此 beta 期间自动更新检查会失败（404）。beta 的 .sig 与 latest.json 仍完整发布，可手动下载安装或用直链验证。"
                : "本版本是 stable：releases/latest 通道立即生效。",
              "SHA256SUMS 和 .sha256 仅供完整性校验，不是身份认证签名；身份认证以同名 .sig（minisign）为准。",
              "将对应目标的安装包与 SHA256SUMS-<target>.txt 下载到同一目录，执行 sha256sum -c SHA256SUMS-<target>.txt（macOS 可用 shasum -a 256 -c）。Actions Artifact 解压后也可在根目录校验。",
            ].join("\n\n");
            let release;

            // 草稿可能不被按 tag 查询返回；分页列出全部发布，拒绝歧义。
            const matches = (await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            })).filter((release) => release.tag_name === tag);
            if (matches.some((release) => !release.draft)) {
              core.setFailed(`标签 ${tag} 的发布已不是草稿，拒绝覆盖。`);
              return;
            }
            if (matches.length > 1) {
              core.setFailed(`标签 ${tag} 存在多个草稿：${matches.map((r) => r.id).join(", ")}，请先人工处理。`);
              return;
            }

            if (matches.length === 1) {
              release = matches[0];
              if (
                release.prerelease !== prerelease ||
                release.name !== releaseName ||
                (release.body ?? "").trim() !== releaseBody
              ) {
                const updated = await github.rest.repos.updateRelease({
                  owner,
                  repo,
                  release_id: release.id,
                  name: releaseName,
                  prerelease,
                  body: releaseBody,
                });
                release = updated.data;
              }
              core.info(`复用已有草稿发布 #${release.id}`);
            } else {
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: true,
                prerelease,
              });

              release = created.data;
              core.info(`已创建草稿发布 #${release.id}`);
            }

            core.setOutput("release_id", String(release.id));
            core.setOutput("release_url", release.html_url);
            core.setOutput("release_body", releaseBody);

  build-tauri:
    needs: create-draft-release
    name: Build ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS x64"
            runner: "macos-latest"
            target: "x86_64-apple-darwin"
          - name: "macOS arm64"
            runner: "macos-latest"
            target: "aarch64-apple-darwin"
          - name: "Linux x64"
            runner: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          - name: "Linux arm64"
            runner: "ubuntu-22.04"
            target: "aarch64-unknown-linux-gnu"
          - name: "Windows x64"
            runner: "windows-2022"
            target: "x86_64-pc-windows-msvc"
          - name: "Windows arm64"
            runner: "windows-latest"
            target: "aarch64-pc-windows-msvc"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-draft-release.outputs.source_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      # 发布通道只看检出源码里的实际版本：tag 构建检出的是 tag 提交（meta 已校验
      # 标签与 tauri.conf.json 版本一致），纯 Artifacts 构建检出的就是当前提交。
      # 不能用 GITHUB_REF_NAME —— workflow_dispatch 时它是启动分支名，与实际
      # 发布标签无关，会把稳定版当预发布（漏 rpm）或反之。
      - id: version
        name: 解析构建版本与发布通道
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          printf 'version=%s\nprerelease=%s\n' "$version" "$prerelease" >> "$GITHUB_OUTPUT"
          echo "构建版本：${version}；预发布：${prerelease}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.target }}

      - name: Install Linux x64 dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Linux arm64 cross dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cat > /tmp/sources.list << 'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse

          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list

          sudo dpkg --add-architecture arm64
          sudo apt-get update
          # libgraphite2-3 / libharfbuzz0b / libfreetype6 / libssl3 are
          # Multi-Arch: same — their :arm64 and :amd64 copies must be the
          # EXACT same version. The runner ships stale :amd64 copies, and a
          # jammy security bump (e.g. graphite2 1.3.14-1ubuntu0.1) made the
          # :arm64 webkit dev chain demand a newer version than the preinstalled
          # :amd64. apt then refuses the :arm64 copy ("not going to be
          # installed" / held broken packages). Upgrading the preinstalled
          # :amd64 copies first lets both arches land on the same version.
          # --only-upgrade never installs new packages, so any lib that is
          # absent is simply skipped.
          sudo apt-get install -y --only-upgrade \
            libgraphite2-3 \
            libharfbuzz0b \
            libfreetype6 \
            libssl3
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libwebkit2gtk-4.1-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64 \
            libssl-dev:arm64 \
            patchelf

      - name: Configure Linux arm64 cross env
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR=aarch64-linux-gnu-gcc-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-Clinker=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc-ar" >> "$GITHUB_ENV"

      - name: Verify Linux arm64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          which aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc -v
          rustup target list --installed
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER}"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR=${CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR}"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=${CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS}"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 更新签名私钥缺失时必须在这里硬失败：没有它，createUpdaterArtifacts
      # 会产出未签名包（或直接构建失败），二者都不能进入发布。
      # Linux arm64 只打 deb/rpm，按设计不产出 updater 资产，不需要该密钥。
      - name: 校验更新签名密钥已配置
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::缺少 Secret TAURI_SIGNING_PRIVATE_KEY：拒绝构建未签名 updater 产物。"
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::warning::未配置 TAURI_SIGNING_PRIVATE_KEY_PASSWORD；仅当私钥未设密码时可以这样。"
          fi
          echo "更新签名私钥已配置（长度 ${#TAURI_SIGNING_PRIVATE_KEY}，不回显内容）。"

      # macOS：导入自签名代码签名证书（Secrets 里的 base64 P12），后续步骤用
      # 同一张证书签名主程序与 computer-use helper。缺少 Secrets 会在这一步
      # 直接失败（中文日志），不会降级为无验签或关闭 computer-use。
      - name: 导入自签名代码签名证书（macOS）
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          CODEG_MACOS_SIGNING_P12: ${{ secrets.CODEG_MACOS_SIGNING_P12 }}
          CODEG_MACOS_SIGNING_PASSWORD: ${{ secrets.CODEG_MACOS_SIGNING_PASSWORD }}
        run: bash scripts/import-macos-self-signed-certificate.sh

      # 自签名证书没有 TeamIdentifier：验签锚定用证书 SHA-1 指纹写法（identity
      # 查找与 requirement 都是 SHA-1，签名 CodeDirectory 仍是 SHA-256）；
      # 绝不写 CODEG_COMPUTER_TEAM_ID。
      - name: 配置 computer-use 双向验签条件（macOS）
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          sha1="${CODEG_COMPUTER_CERT_SHA1:-}"
          if ! printf '%s' "$sha1" | grep -Eq '^[0-9A-F]{40}$'; then
            echo "::error::CODEG_COMPUTER_CERT_SHA1 不是 40 位十六进制 SHA-1（导入脚本未正常导出）。"
            exit 1
          fi
          helper_req="identifier \"app.codeg.computer-helper\" and certificate leaf = H\"$sha1\""
          peer_req="(identifier \"app.codeg\" or identifier \"codeg-server\") and certificate leaf = H\"$sha1\""
          csreq -r="$helper_req" -t >/dev/null
          csreq -r="$peer_req" -t >/dev/null
          echo "CODEG_COMPUTER_HELPER_REQUIREMENT=$helper_req" >> "$GITHUB_ENV"
          echo "CODEG_COMPUTER_PEER_REQUIREMENT=$peer_req" >> "$GITHUB_ENV"
          echo "已生成 computer-use 双向验签条件（证书 SHA-1 指纹：${sha1}）："
          echo "  helper: $helper_req"
          echo "  peers : $peer_req"

      # 导入 / 清理脚本的门禁测试：归属校验（拒绝路径穿越、多层目录、符号链接、
      # 文件名不符）、列表读改写只增删本 job 的条目（并行导入 / 清理时别人的与
      # 用户自己的条目必须保留）、导入失败回滚、以及全局 mkdir 锁。用真实
      # security / codesign 跑；只动本脚本自己的临时 keychain，不碰 TCC。
      - name: 自签名 keychain 导入/清理门禁测试（macOS）
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          CODEG_MACOS_SIGNING_P12: ${{ secrets.CODEG_MACOS_SIGNING_P12 }}
          CODEG_MACOS_SIGNING_PASSWORD: ${{ secrets.CODEG_MACOS_SIGNING_PASSWORD }}
          CODEG_TEST_REQUIRE_IMPORT: "1"
        run: bash scripts/test-import-macos-self-signed-certificate.sh

      # Build the sidecars — the `codeg-mcp` companion, the
      # `codeg-computer-helper` computer-use executor and the `codeg-cli`
      # command-line client — for the matrix target
      # and stage them at `src-tauri/binaries/<bin>-<triple>{.exe}`.
      # `tauri-action` (below) then bundles them via the `bundle.externalBin`
      # entries in `tauri.conf.json` — Tauri installs them next to the main
      # executable (install root on Linux/Windows) where the runtime finds
      # them via `current_exe` sibling lookup. On macOS the helper is no
      # sidecar: it is staged as `src-tauri/binaries/codeg-computer-helper.app`
      # and bundled as `Contents/Helpers/codeg-computer-helper.app`
      # (`tauri.macos.conf.json`), since macOS charges an executable's
      # permissions to the app bundle it sits in — a helper in Contents/MacOS
      # would hold codeg's. The Linux arm64 cross env vars set above also
      # apply to this cargo invocation.
      - name: Stage sidecars for Tauri bundle
        shell: bash
        run: pnpm tauri:prepare-sidecars --target ${{ matrix.target }}

      - name: Verify sidecars landed
        shell: bash
        run: |
          ext=""
          case "${{ matrix.target }}" in
            *windows*) ext=".exe" ;;
          esac
          for bin in codeg-mcp codeg-computer-helper codeg-cli; do
            file="src-tauri/binaries/${bin}-${{ matrix.target }}${ext}"
            if [ ! -s "$file" ]; then
              echo "FATAL: sidecar $file missing or empty after prepare-sidecars"
              exit 1
            fi
            ls -la "$file"
          done
          case "${{ matrix.target }}" in
            *apple-darwin*)
              helper="src-tauri/binaries/codeg-computer-helper.app/Contents/MacOS/codeg-computer-helper"
              if [ ! -s "$helper" ]; then
                echo "FATAL: helper app executable $helper missing or empty after prepare-sidecars"
                exit 1
              fi
              ls -la "$helper"
              # staging 已显式签名（identifier 写死 + hardened runtime）：bundler 重签
              # 不保留自定义 identifier，这里先确认，别等到打包后才失败。
              mcp="src-tauri/binaries/codeg-mcp-${{ matrix.target }}"
              cli="src-tauri/binaries/codeg-cli-${{ matrix.target }}"
              for pair in "$mcp:codeg-mcp" "$cli:codeg-cli" "$helper:app.codeg.computer-helper"; do
                path="${pair%:*}"
                ident="${pair#*:}"
                info="$(codesign -dv "$path" 2>&1)"
                if ! printf '%s\n' "$info" | grep -qx "Identifier=$ident"; then
                  echo "FATAL: $path 的签名标识不是 $ident"
                  exit 1
                fi
                if ! printf '%s\n' "$info" | grep -qE '^CodeDirectory .*\(runtime\)'; then
                  echo "FATAL: $path 缺少 hardened runtime（签名 flags 里没有 runtime）"
                  exit 1
                fi
              done
              ;;
          esac

      - name: 诊断 Windows Tauri 构建环境
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "运行器：$env:RUNNER_OS $env:RUNNER_ARCH"
          Write-Host "目标：${{ matrix.target }}"
          Write-Host "Node：$(node --version)"
          Write-Host "pnpm：$(pnpm --version)"
          Write-Host "Rust：$(rustc --version)"
          Write-Host "Tauri CLI：$(pnpm exec tauri --version)"
          Write-Host "sidecar："
          Get-ChildItem -LiteralPath 'src-tauri/binaries' -Force |
            Select-Object -First 20 Name,Length,LastWriteTime |
            Format-Table -AutoSize
          Write-Host "目标 release 目录："
          $release = "src-tauri/target/${{ matrix.target }}/release"
          if (Test-Path -LiteralPath $release) {
            Get-ChildItem -LiteralPath $release -Force |
              Select-Object -First 40 Name,Length,LastWriteTime |
              Format-Table -AutoSize
          }

      # I5 门禁：证书模式下的两项运行时验证 —— (1) 内核在 exec 处拒绝不合规镜像，
      # (2) 签名之后 主程序 ↔ helper 的双向握手。用本次 CI 证书签出的无副作用
      # fixture 与定向测试 harness、以及 staging 阶段签名过的真实 helper 实测；
      # 只在原生 arm64 macOS 矩阵跑（x64 仍保留原有签名 / 结构门禁）。最耗时的
      # 是 debug 测试编译（cargo test --no-run），一次完成。
      #
      # SIP：只有 `csrutil` 显示 enabled 时内核才保持 launch requirement；否则测试
      # 打印 NOT-VERIFIED，这一步把它写进 step summary 的「内核拒绝未验证」，绝不当
      # 成通过。双向握手与 SIP 无关，必须实际通过。
      - name: 证书模式内核约束与双向握手实测（macOS arm64）
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          echo "宿主：$(uname -srm)，macOS $(sw_vers -productVersion)"
          sip="$(csrutil status 2>&1 || true)"
          printf '%s\n' "$sip"
          if printf '%s' "$sip" | grep -q 'status: enabled'; then
            sip_state="enabled"
          else
            sip_state="disabled"
          fi

          work="$RUNNER_TEMP/codeg-selfsigned-tests"
          rm -rf "$work"
          mkdir -p "$work"

          # 1) 无副作用原生 fixture：只在 CODEG_TEST_FIXTURE_MARKER 指向的临时文件里
          #    写几个字节，不碰 TCC / 屏幕 / 鼠标。两份内容不同、同一张证书、同一个
          #    identifier —— 用来验证「验签之后文件被替换」在 exec 处被拒绝。
          cat > "$work/fixture.c" <<'EOF'
          #include <fcntl.h>
          #include <stdlib.h>
          #include <unistd.h>

          #ifndef CODEG_FIXTURE_TAG
          #define CODEG_FIXTURE_TAG "primary"
          #endif

          static const char tag[] = CODEG_FIXTURE_TAG;

          int main(void) {
            const char *marker = getenv("CODEG_TEST_FIXTURE_MARKER");
            if (marker != (const char *)0) {
              int fd = open(marker, O_WRONLY | O_CREAT | O_TRUNC, 0600);
              if (fd >= 0) {
                ssize_t written = write(fd, tag, sizeof tag - 1);
                (void)written;
                close(fd);
              }
            }
            return 0;
          }
          EOF
          clang -O0 -o "$work/fixture-primary" "$work/fixture.c" -DCODEG_FIXTURE_TAG='"primary"'
          clang -O0 -o "$work/fixture-other" "$work/fixture.c" -DCODEG_FIXTURE_TAG='"other-fixture"'
          for fixture in "$work/fixture-primary" "$work/fixture-other"; do
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --keychain "$CODEG_MACOS_KEYCHAIN" \
              -i app.codeg.computer-helper --options runtime --digest-algorithm=sha256 \
              --timestamp=none "$fixture"
            codesign --verify --strict "$fixture"
          done

          # 2) 定向测试 harness：编译 lib 测试（不运行），再签两份 ——
          #    a) 同一张证书 + identifier app.codeg + hardened runtime：helper 信任的 parent；
          #    b) 同一份可执行文件、去掉证书签名（Adhoc）：helper 必须拒绝的 parent。
          #    lib 测试带 tauri-runtime，tauri-build 检查前端 out/ 目录，先建好。
          mkdir -p out
          ( cd src-tauri && cargo test --features test-utils --lib --no-run 2>&1 | tee "$work/cargo-no-run.log" )
          # cargo 在 CI 的 Cargo.term.color=always 下会给 "Executable" 也加 ANSI 颜色码
          # （ESC[1m ESC[92m ... ESC[0m），旧写法 ^ *Executable 匹配不到，harness 会是空值，
          # case 再把它拼成 $PWD/src-tauri/ 目录 —— 而目录能通过 [ -x ]，于是 cp 报
          # "cp: .../src-tauri/ is a directory (not copied)"（run38382839821）。
          # 先删掉 ANSI CSI 颜色码再解析：用字面 ESC（$'...' 由 bash 展开），不依赖 GNU 扩展；
          # 门禁同时要求「是文件且可执行」，失败时打印 cargo 日志尾部，绝不拼空路径去 cp。
          harness="$(sed $'s/\033\\[[0-9;]*m//g' "$work/cargo-no-run.log" | sed -n -E 's/^ *Executable .* \((.*)\)$/\1/p' | head -1)"
          case "$harness" in
            /*) ;;
            *) harness="$PWD/src-tauri/$harness" ;;
          esac
          if [ ! -f "$harness" ] || [ ! -x "$harness" ]; then
            echo "::error::找不到测试 harness（解析结果：${harness:-<空>}）；cargo 日志尾部："
            tail -n 20 "$work/cargo-no-run.log"
            exit 1
          fi
          cp "$harness" "$work/harness-trusted"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --keychain "$CODEG_MACOS_KEYCHAIN" \
            -i app.codeg --options runtime --digest-algorithm=sha256 --timestamp=none "$work/harness-trusted"
          codesign --verify --strict "$work/harness-trusted"
          cp "$harness" "$work/harness-adhoc"
          codesign --force --sign - "$work/harness-adhoc"
          echo "测试 harness：$harness"
          codesign -dv "$work/harness-trusted" 2>&1 | grep -E '^(Identifier|CodeDirectory)' || true

          helper="src-tauri/binaries/codeg-computer-helper.app/Contents/MacOS/codeg-computer-helper"
          if [ ! -x "$helper" ]; then
            echo "::error::staging 的 helper 不存在：$helper"
            exit 1
          fi

          # 3) 内核约束：正例真的 exec；错 cdhash 与「验签后被替换」在 exec 处被拒
          kernel_log="$work/kernel.log"
          set +e
          CODEG_TEST_SELF_SIGNED_BIN="$work/fixture-primary" \
          CODEG_TEST_SELF_SIGNED_OTHER_BIN="$work/fixture-other" \
          CODEG_TEST_SELF_SIGNED_SHA1="$CODEG_COMPUTER_CERT_SHA1" \
            "$harness" --ignored --nocapture --test-threads=1 \
            computer::spawn::tests::a_certificate_launch_requirement_holds_at_exec \
            >"$kernel_log" 2>&1
          kernel_rc=$?
          set -e
          cat "$kernel_log"
          if [ "$kernel_rc" -ne 0 ]; then
            echo "::error::内核约束测试失败（rc=${kernel_rc}）"
            exit 1
          fi

          # 4) 双向握手：签成 app.codeg 的 parent 必须被验成 Verified；无证书（Adhoc）
          #    的 parent 必须被拒。只握手与关闭，不发任何 op，不触发 TCC。
          peer_log="$work/peer.log"
          refused_log="$work/peer-refused.log"
          if ! CODEG_TEST_HELPER="$helper" CODEG_TEST_PEER=verified \
            "$work/harness-trusted" --ignored --nocapture --test-threads=1 \
            computer::local::tests::a_signed_helper_verifies_a_signed_codeg_parent \
            >"$peer_log" 2>&1; then
            cat "$peer_log"
            echo "::error::签名后双向握手（正例）失败"
            exit 1
          fi
          cat "$peer_log"
          if ! CODEG_TEST_HELPER="$helper" CODEG_TEST_PEER=refused \
            "$work/harness-adhoc" --ignored --nocapture --test-threads=1 \
            computer::local::tests::a_signed_helper_verifies_a_signed_codeg_parent \
            >"$refused_log" 2>&1; then
            cat "$refused_log"
            echo "::error::签名后双向握手（负例：无证书的 parent 必须被拒）失败"
            exit 1
          fi
          cat "$refused_log"

          # 5) 结论与条件写进 step summary（宿主 arch / SIP 状态 / 每项的证据）
          {
            echo "### 自签名 computer-use 运行时实测"
            echo ""
            echo "- 宿主：\`$(uname -m)\`，macOS \`$(sw_vers -productVersion)\`，target \`${{ matrix.target }}\`"
            echo "- \`csrutil status\`：**$sip_state**"
            if grep -q 'codeg-kernel-constraint: VERIFIED' "$kernel_log"; then
              echo "- 内核拒绝不合规镜像：**已验证**（正例 exec 成功；错 cdhash 与「验签后被替换」都在 exec 处 SIGKILL，无任何副作用）"
            elif grep -q 'NOT-VERIFIED reason=sip-disabled' "$kernel_log"; then
              echo "- 内核拒绝不合规镜像：**内核拒绝未验证** —— runner 的 SIP 为 disabled，内核不保持 launch requirement。这不是通过，也没有伪装成通过；请按真实 runner 的 SIP 状态判断交付。"
            else
              echo "::error::内核约束测试没有报告结果"
              exit 1
            fi
            if grep -q 'codeg-signed-handshake: VERIFIED' "$peer_log"; then
              echo "- 签名后双向握手（同一证书签成 app.codeg 的 parent）：**已验证** PeerCheck::Verified"
            else
              echo "::error::签名后双向握手没有报告 VERIFIED"
              exit 1
            fi
            if grep -q 'codeg-signed-handshake: REFUSED' "$refused_log"; then
              echo "- 签名后双向握手（无证书 / 另一张证书的 parent）：**已拒绝** EXIT_PEER_REFUSED"
            else
              echo "::error::无证书的 parent 没有被 helper 拒绝"
              exit 1
            fi
            echo ""
            echo "fixture 与 harness 都由本次 CI 证书签出；helper 是 staging 阶段签名过的真实产物；测试只握手 / 关闭，未触发 TCC 权限，未做屏幕或鼠标动作。"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build and upload to draft release (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # The matrix-target sidecar is already staged and verified above.
          # Skip the duplicate beforeBuildCommand sidecar pass so cross builds
          # do not fall back to the runner host triple.
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /usr/aarch64-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR: aarch64-linux-gnu-gcc-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Clinker=aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc-ar
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ needs.create-draft-release.outputs.tag }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          # RPM 不接受版本号里的 "-"，rc 版本（x.y.z-rc.N）只出 deb。
          # Linux arm64 按设计不产出 updater 资产，因此关闭 createUpdaterArtifacts。
          args: --target ${{ matrix.target }} --bundles ${{ steps.version.outputs.prerelease == 'true' && 'deb' || 'deb,rpm' }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          assetNamePattern: "beecode_[version]_[arch][setup][ext]"
          includeUpdaterJson: false
          retryAttempts: 2

      - name: Build and upload to draft release (Windows)
        if: contains(matrix.target, 'windows')
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # The matrix-target sidecar is already staged and verified above.
          # Skip the duplicate beforeBuildCommand sidecar pass so cross builds
          # do not fall back to the runner host triple.
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 签名密钥：tauri CLI 用它给 createUpdaterArtifacts 产出的
          # *-setup.exe 生成 .sig；createUpdaterArtifacts 由 tauri.conf.json 打开。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ needs.create-draft-release.outputs.tag }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          # externalBin 会触发 MSI 的 light.exe 问题，仅生成 NSIS 原包。
          # createUpdaterArtifacts 由 tauri.conf.json 打开并签名原包；latest.json
          # 等全部矩阵完成后由 generate-updater-manifest 统一生成。
          args: --target ${{ matrix.target }} --bundles nsis
          assetNamePattern: "beecode_[version]_[arch][setup][ext]"
          includeUpdaterJson: false
          retryAttempts: 2

      - name: 收集 Windows Tauri 失败诊断
        if: ${{ failure() && contains(matrix.target, 'windows') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Windows Tauri 构建失败：${{ matrix.target }}"
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle"
          if (Test-Path -LiteralPath $bundle) {
            Get-ChildItem -LiteralPath $bundle -Recurse -Force |
              Where-Object { $_.Extension -in '.exe', '.sig', '.nsi', '.log' } |
              Select-Object -First 200 FullName,Length,LastWriteTime |
              Format-Table -AutoSize
          } else {
            Write-Host "未生成安装包目录：$bundle"
          }

      - name: Build and upload to draft release (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # The matrix-target sidecar is already staged and verified above.
          # Skip the duplicate beforeBuildCommand sidecar pass so cross builds
          # do not fall back to the runner host triple.
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 签名密钥：tauri CLI 用它给 createUpdaterArtifacts 产出的
          # updater 包生成 .sig；createUpdaterArtifacts 由 tauri.conf.json 打开。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ needs.create-draft-release.outputs.tag }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          # rc 版本（x.y.z-rc.N）跳过 rpm：版本号里的 "-" 会让 bundler 报错。
          # latest.json 等全部矩阵完成后由 generate-updater-manifest 统一生成，
          # 所以这里 includeUpdaterJson 保持 false。
          args: --target ${{ matrix.target }}${{ steps.version.outputs.prerelease == 'true' && ' --bundles deb,appimage' || '' }}
          assetNamePattern: "beecode_[version]_[arch][setup][ext]"
          includeUpdaterJson: false
          retryAttempts: 2

      # 签名身份取导入脚本写入 GITHUB_ENV 的 APPLE_SIGNING_IDENTITY（证书
      # SHA-1）；staged codeg-mcp 与 helper.app 已用同一证书预签（identifier 写死、
      # 带 hardened runtime）—— bundler 会重签侧车与最外层 bundle，但不重签嵌套
      # helper（先内后外）；DMG 之后不再改动 app。hardenedRuntime 显式开启（不依赖
      # 配置默认值），门禁要求主程序也带 runtime flag。
      - name: 构建自签名免费安装包（macOS）
        if: contains(matrix.target, 'apple-darwin')
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # The matrix-target sidecar is already staged and verified above.
          # Skip the duplicate beforeBuildCommand sidecar pass so cross builds
          # do not fall back to the runner host triple.
          CODEG_SKIP_SIDECAR: "1"
          # beforeBuildCommand runs `next build`, whose type-check needs more
          # than the 2 GB heap Node defaults to on these 7 GB runners; 4 GB is
          # what Node already gets on the 16 GB Linux and Windows runners.
          NODE_OPTIONS: --max-old-space-size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 签名密钥：tauri CLI 用它给 createUpdaterArtifacts 产出的
          # BeeCode.app.tar.gz 生成 .sig；createUpdaterArtifacts 由 tauri.conf.json 打开。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ needs.create-draft-release.outputs.tag }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --config '{"bundle":{"macOS":{"hardenedRuntime":true}}}'
          assetNamePattern: "beecode_[version]_[arch][setup][ext]"
          includeUpdaterJson: false
          retryAttempts: 2

      # Linux arm64 只打 deb/rpm，按设计不产出 updater 资产；其余桌面目标
      # 必须在这里就看到非空的 updater .sig，避免未签名包走到发布。
      # 产物名对照 tauri-cli 2.11.4 / tauri-action v0.6.1：createUpdaterArtifacts
      # 为 bool true 即 v2 模式，直接签原包——macOS 在 bundle/macos 签
      # BeeCode.app.tar.gz，Linux 在 bundle/appimage 签 *.AppImage、bundle/deb 签
      # *.deb、bundle/rpm 签 *.rpm（deb/rpm 的 -deb / -rpm 平台键依赖这两份签名），
      # Windows 在 bundle/nsis 签 *-setup.exe；tar.gz/zip 包装只在 "v1Compatible" 模式下产出。
      # 预发布（版本号带 "-"）只构建 deb + AppImage，没有 rpm 签名可查。
      - name: 校验 updater 产物已签名
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        env:
          # 与两个构建步骤使用同一个版本判断；不要用 GITHUB_REF_NAME（dispatch
          # 时它是启动分支名），否则稳定版发布可能漏查 rpm 签名。
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          case "${{ matrix.target }}" in
            *apple-darwin) candidates=("$bundle/macos/BeeCode.app.tar.gz.sig") ;;
            x86_64-unknown-linux-gnu)
              candidates=("$bundle"/appimage/*.AppImage.sig "$bundle"/deb/*.deb.sig)
              # 预发布不构建 rpm（与上方 --bundles 判断保持一致）。
              if [ "$PRERELEASE" != "true" ]; then
                candidates+=("$bundle"/rpm/*.rpm.sig)
              fi
              ;;
            *windows*) candidates=("$bundle"/nsis/*-setup.exe.sig) ;;
            *) echo "::error::未知桌面目标：${{ matrix.target }}"; exit 1 ;;
          esac
          for sig in "${candidates[@]}"; do
            if [ ! -s "$sig" ]; then
              echo "::error::缺少 updater 签名产物：$sig"
              ls -la "$(dirname "$sig")" || true
              exit 1
            fi
            node -e 'const fs = require("node:fs"); const decode = text => Buffer.from(Buffer.from(text.trim(), "base64").toString("utf8").split(/\r?\n/)[1], "base64"); const key = decode(JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).plugins.updater.pubkey); const sig = decode(fs.readFileSync(process.argv[1], "utf8")); if (key.length !== 42 || sig.length !== 74 || !key.subarray(2, 10).equals(sig.subarray(2, 10))) throw new Error("签名 key ID 与客户端公钥不匹配，拒绝发布"); console.log("签名 key ID 与客户端公钥一致")' "$sig"
            echo "已生成 updater 签名：$sig"
          done

      # 保留包结构、严格签名、无权限扩展、hardened runtime 及符号黑名单门禁；证书模式按 SHA-1 指纹双向验签通过。
      - name: 检查自签名包签名、结构与符号（macOS）

        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/BeeCode.app"
          if [ ! -d "$app" ]; then
            echo "FATAL: $app not found"
            exit 1
          fi
          codesign --verify --strict --deep "$app"
          helper_app="$app/Contents/Helpers/codeg-computer-helper.app"
          if [ -e "$app/Contents/MacOS/codeg-computer-helper" ]; then
            echo "FATAL: codeg-computer-helper is in Contents/MacOS, where macOS charges it to codeg"
            exit 1
          fi
          if [ ! -d "$helper_app" ]; then
            echo "FATAL: $helper_app not found"
            exit 1
          fi
          if [ -e "$app/Contents/MacOS/codeg-server" ]; then
            echo "FATAL: codeg-server is in the desktop bundle; its binary target must need server-bin"
            exit 1
          fi
          for sidecar in codeg-mcp codeg-cli; do
            if otool -L "$app/Contents/MacOS/$sidecar" | grep -q 'WebKit'; then
              echo "FATAL: $sidecar links WebKit: tauri build's own copy replaced the sidecar"
              exit 1
            fi
          done
          for path in "$app/Contents/MacOS/codeg" "$app/Contents/MacOS/codeg-mcp" "$app/Contents/MacOS/codeg-cli" "$helper_app"; do
            name="$(basename "$path")"
            codesign --verify --strict "$path"
            if ! codesign -dv "$path" 2>&1 | grep -qE '^CodeDirectory .*\(runtime\)'; then
              echo "FATAL: $name 缺少 hardened runtime（签名 flags 里没有 runtime）"
              codesign -dv "$path" || true
              exit 1
            fi
            if codesign -d --entitlements - --xml "$path" 2>/dev/null | grep -q '<key>'; then
              echo "FATAL: $name carries entitlements; codeg's executables must carry none"
              codesign -d --entitlements - "$path" || true
              exit 1
            fi
          done
          # 证书模式锚必须存在且格式有效：40 位 SHA-1 + 两份锚定同一证书的
          # requirement；绝不回退到关闭模式（never）。
          sha1="${CODEG_COMPUTER_CERT_SHA1:-}"
          if ! printf '%s' "$sha1" | grep -Eq '^[0-9A-F]{40}$'; then
            echo '::error::CODEG_COMPUTER_CERT_SHA1 缺失或不是 40 位十六进制 SHA-1'
            exit 1
          fi
          for req_var in CODEG_COMPUTER_PEER_REQUIREMENT CODEG_COMPUTER_HELPER_REQUIREMENT; do
            req="${!req_var:-}"
            if [ "$req" = never ] || [ -z "$req" ]; then
              echo "::error::$req_var 缺失或仍是关闭模式"
              exit 1
            fi
            if ! printf '%s' "$req" | grep -qF "H\"$sha1\""; then
              echo "::error::$req_var 未锚定到本次证书 SHA-1 指纹"
              exit 1
            fi
          done
          codesign --verify --strict -R="$CODEG_COMPUTER_PEER_REQUIREMENT" "$app/Contents/MacOS/codeg"
          codesign --verify --strict -R="$CODEG_COMPUTER_HELPER_REQUIREMENT" "$helper_app"
          # codeg-mcp 与 codeg-cli 也必须用同一张证书（标识 + 证书叶子哈希）。
          req_mcp="identifier \"codeg-mcp\" and certificate leaf = H\"$sha1\""
          req_cli="identifier \"codeg-cli\" and certificate leaf = H\"$sha1\""
          codesign --verify --strict -R="$req_mcp" "$app/Contents/MacOS/codeg-mcp"
          codesign --verify --strict -R="$req_cli" "$app/Contents/MacOS/codeg-cli"
          deny='^_(CGEventPost|CGEventPostToPid|CGEventPostToPSN|CGEventTapCreate|CGEventTapCreateForPid|CGEventTapCreateForPSN|CGWindowListCreateImage|CGWindowListCreateImageFromArray|CGDisplayCreateImage|CGDisplayCreateImageForRect|CGDisplayStreamCreate|CGDisplayStreamCreateWithDispatchQueue|CGRequestScreenCaptureAccess|CGRequestPostEventAccess|AXIsProcessTrustedWithOptions|AXUIElement[A-Za-z]*|AXObserver[A-Za-z]*)$|^_OBJC_CLASS_\$_SC(ShareableContent|Stream|ScreenshotManager|ContentFilter|ContentSharingPicker)$'
          for bin in codeg codeg-mcp codeg-cli; do
            hits="$(nm -u "$app/Contents/MacOS/$bin" | grep -E "$deny" || true)"
            if [ "$bin" = codeg ]; then
              hits="$(printf '%s\n' "$hits" | grep -vx '_CGEventTapCreate' || true)"
            fi
            if [ -n "$hits" ]; then
              echo "FATAL: $bin references APIs only codeg-computer-helper may use:"
              echo "$hits"
              exit 1
            fi
          done
          codesign -dv "$app/Contents/MacOS/codeg" 2>&1 | grep -E '^(Identifier|TeamIdentifier)=' || true
          echo '自签名包严格签名、结构和符号检查通过；computer-use 双向验签按同一张自签名证书匹配。包未经 Apple 公证，可能出现 Gatekeeper 提示。'

      - name: 生成桌面安装包 SHA256SUMS（Unix）
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          if [ ! -d "$bundle" ]; then
            echo "::error::安装包目录不存在：$bundle"
            exit 1
          fi
          cd "$bundle"
          case "$TARGET" in
            *apple-darwin) kinds=(dmg) ;;
            aarch64-unknown-linux-gnu) kinds=(deb rpm) ;;
            x86_64-unknown-linux-gnu) kinds=(deb rpm AppImage) ;;
            *) echo '::error::未知桌面目标'; exit 1 ;;
          esac
          mkdir -p installers
          manifest="installers/SHA256SUMS-$TARGET.txt"
          : > "$manifest"
          for kind in "${kinds[@]}"; do
            directory="$kind"
            [ "$kind" != AppImage ] || directory=appimage
            if [ ! -d "$directory" ]; then
              echo "::error::缺少 $TARGET 的 $kind 安装包目录"
              exit 1
            fi
            count=0
            while IFS= read -r -d '' file; do
              name="${file##*/}"
              # 对齐 tauri-action 的 assetNamePattern；RPM 原生名使用连字符与 release。
              name="${name/#BeeCode/beecode}"
              if [ "$kind" = rpm ]; then
                name="$(printf '%s' "$name" | sed -E 's/^beecode-(.+)-1\.([^.]+)\.rpm$/beecode_\1_\2.rpm/')"
              fi
              if [ -e "installers/$name" ]; then
                echo "::error::安装包文件名重复：$name"
                exit 1
              fi
              cp "$file" "installers/$name"
              (cd installers && shasum -a 256 "$name") >> "$manifest"
              count=$((count + 1))
            done < <(find "$directory" -maxdepth 1 -type f -name "*.$kind" -print0)
            if [ "$count" -eq 0 ]; then
              echo "::error::缺少 $TARGET 的 $kind 安装包"
              exit 1
            fi
          done
          cat "$manifest"
          echo 'SHA256 仅为完整性校验，不是身份认证签名。'

      - name: 生成桌面安装包 SHA256SUMS（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $bundle = "src-tauri/target/$env:TARGET/release/bundle"
          $files = @(Get-ChildItem -LiteralPath "$bundle/nsis" -File -Filter '*.exe' -ErrorAction Stop)
          if ($files.Count -eq 0) { throw "缺少 $env:TARGET 的 NSIS 安装包" }
          $stage = "$bundle/installers"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $lines = foreach ($file in $files) {
            $name = $file.Name -creplace '^BeeCode_', 'beecode_'
            $destination = Join-Path $stage $name
            if (Test-Path -LiteralPath $destination) { throw "安装包文件名重复：$($file.Name)" }
            Copy-Item -LiteralPath $file.FullName -Destination $destination
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLower()
            "$hash  $name"
          }
          $lines | Set-Content -Encoding ascii -LiteralPath "$stage/SHA256SUMS-$env:TARGET.txt"
          Write-Host 'SHA256 仅为完整性校验，不是身份认证签名。'

      - name: 上传桌面安装包与完整性校验文件
        uses: actions/upload-artifact@v4
        with:
          name: beecode-desktop-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/installers
          if-no-files-found: error

      - name: 检出当前发布上传脚本
        if: needs.create-draft-release.outputs.release_id != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts/upload-release-assets.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 上传桌面校验文件到草稿发布
        if: needs.create-draft-release.outputs.release_id != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
          TARGET: ${{ matrix.target }}
        run: |
          node .release-tools/scripts/upload-release-assets.mjs "src-tauri/target/$TARGET/release/bundle/installers/SHA256SUMS-$TARGET.txt"

      # cleanup 在 always() 阶段还原 keychain 搜索列表并删除本 job 的临时
      # keychain；失败路径也要执行。清理本身不需要 secrets。
      - name: 清理临时签名 keychain（macOS）
        if: always() && contains(matrix.target, 'apple-darwin')
        shell: bash
        run: bash scripts/import-macos-self-signed-certificate.sh cleanup

  build-server:
    needs: create-draft-release
    name: Server ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux x64"
            runner: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            artifact: "beecode-server-linux-x64"
          - name: "Linux arm64"
            runner: "ubuntu-22.04"
            target: "aarch64-unknown-linux-gnu"
            artifact: "beecode-server-linux-arm64"
          - name: "macOS x64"
            runner: "macos-latest"
            target: "x86_64-apple-darwin"
            artifact: "beecode-server-darwin-x64"
          - name: "macOS arm64"
            runner: "macos-latest"
            target: "aarch64-apple-darwin"
            artifact: "beecode-server-darwin-arm64"
          - name: "Windows x64"
            runner: "windows-2022"
            target: "x86_64-pc-windows-msvc"
            artifact: "beecode-server-windows-x64"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-draft-release.outputs.source_ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: server-${{ matrix.target }}

      - name: Install Linux arm64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cat > /tmp/sources.list << 'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse

          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list

          sudo dpkg --add-architecture arm64
          sudo apt-get update
          # libssl3 is Multi-Arch: same; align the preinstalled :amd64 copy
          # with the version libssl-dev:arm64 pins so the cross install isn't
          # blocked by a held-back amd64 copy (same failure mode as the desktop
          # arm64 build — see the build-tauri step for the full rationale).
          sudo apt-get install -y --only-upgrade libssl3
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libssl-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc-ar" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Build frontend
        env:
          # The `next build` type-check needs more than the 2 GB heap Node
          # defaults to on the 7 GB macOS runners. 4 GB is what Node already
          # gets on the 16 GB Linux and Windows runners, so it changes nothing
          # there.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # macOS 服务器包同样先导入自签名证书，再生成 computer-use 双向验签
      # 条件（编译期锚定）。缺少 Secrets 在导入步直接失败（中文日志）。
      - name: 导入自签名代码签名证书（macOS 服务器）
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          CODEG_MACOS_SIGNING_P12: ${{ secrets.CODEG_MACOS_SIGNING_P12 }}
          CODEG_MACOS_SIGNING_PASSWORD: ${{ secrets.CODEG_MACOS_SIGNING_PASSWORD }}
        run: bash scripts/import-macos-self-signed-certificate.sh

      - name: 配置 computer-use 双向验签条件（macOS 服务器）
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          sha1="${CODEG_COMPUTER_CERT_SHA1:-}"
          if ! printf '%s' "$sha1" | grep -Eq '^[0-9A-F]{40}$'; then
            echo "::error::CODEG_COMPUTER_CERT_SHA1 不是 40 位十六进制 SHA-1（导入脚本未正常导出）。"
            exit 1
          fi
          helper_req="identifier \"app.codeg.computer-helper\" and certificate leaf = H\"$sha1\""
          peer_req="(identifier \"app.codeg\" or identifier \"codeg-server\") and certificate leaf = H\"$sha1\""
          csreq -r="$helper_req" -t >/dev/null
          csreq -r="$peer_req" -t >/dev/null
          echo "CODEG_COMPUTER_HELPER_REQUIREMENT=$helper_req" >> "$GITHUB_ENV"
          echo "CODEG_COMPUTER_PEER_REQUIREMENT=$peer_req" >> "$GITHUB_ENV"
          echo "已生成 computer-use 双向验签条件（证书 SHA-1 指纹：${sha1}）。"

      - name: Build server + codeg-mcp companion + computer-use helper + codeg-cli

        working-directory: src-tauri
        # `codeg-mcp` is the stdio MCP companion the runtime injects per
        # session (see acp/delegation/companion.rs). Built with the same
        # `--no-default-features --target` flags as the server so it shares
        # the cross-compile env (Linux arm64) without dragging in tauri
        # runtime deps. Each binary target needs its own feature (Cargo.toml).
        # helper 保持随服务器分发；macOS 在编译期锚定自签名证书的双向验签
        # 条件（computer-use 保留），其他平台仍仅在桌面会话设置
        # CODEG_COMPUTER_USE=1 时启用。
        # codeg-cli 是命令行客户端（codeg-cli run），供服务器本机的 CI 与脚本使用，也可通过 --url 连接。
        run: |
          cargo build --release --bin codeg-server --no-default-features --features server-bin --target ${{ matrix.target }}
          cargo build --release --bin codeg-mcp --no-default-features --features mcp-bin --target ${{ matrix.target }}
          cargo build --release --bin codeg-computer-helper --no-default-features --features computer-helper --target ${{ matrix.target }}
          cargo build --release --bin codeg-cli --no-default-features --features cli-bin --target ${{ matrix.target }}

      # 固定证书和标识使 macOS 权限授权跨更新保持稳定，避免 ad-hoc 签名随构建改变。
      # 沿用已配置的自签名证书；helper 标识与编译期双向验签条件保持一致。
      - name: 用自签名证书严格签服务器二进制（macOS）
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          dir="src-tauri/target/${{ matrix.target }}/release"
          sha1="$CODEG_COMPUTER_CERT_SHA1"
          if ! printf '%s' "$sha1" | grep -Eq '^[0-9A-F]{40}$'; then
            echo '::error::CODEG_COMPUTER_CERT_SHA1 缺失或不是 40 位十六进制 SHA-1'
            exit 1
          fi
          # 证书模式：hardened runtime + SHA-256 CodeDirectory（identifier 显式写死）。
          sign=(--force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --digest-algorithm=sha256)
          codesign "${sign[@]}" -i codeg-server "$dir/codeg-server"
          codesign "${sign[@]}" -i codeg-mcp "$dir/codeg-mcp"
          codesign "${sign[@]}" -i codeg-cli "$dir/codeg-cli"
          codesign "${sign[@]}" -i app.codeg.computer-helper "$dir/codeg-computer-helper"
          codesign --verify --strict -R="$CODEG_COMPUTER_PEER_REQUIREMENT" "$dir/codeg-server"
          req_mcp="identifier \"codeg-mcp\" and certificate leaf = H\"$sha1\""
          req_cli="identifier \"codeg-cli\" and certificate leaf = H\"$sha1\""
          codesign --verify --strict -R="$req_mcp" "$dir/codeg-mcp"
          codesign --verify --strict -R="$req_cli" "$dir/codeg-cli"
          codesign --verify --strict -R="$CODEG_COMPUTER_HELPER_REQUIREMENT" "$dir/codeg-computer-helper"
          # 四个二进制都验签名标识与 hardened runtime；标识不对或缺 runtime 不得发出。
          for pair in codeg-server:codeg-server codeg-mcp:codeg-mcp codeg-cli:codeg-cli codeg-computer-helper:app.codeg.computer-helper; do
            bin="${pair%%:*}"
            ident="${pair#*:}"
            info="$(codesign -dv "$dir/$bin" 2>&1)"
            if ! printf '%s\n' "$info" | grep -qx "Identifier=$ident"; then
              echo "::error::$bin 的签名标识不是 $ident"
              exit 1
            fi
            if ! printf '%s\n' "$info" | grep -qE '^CodeDirectory .*\(runtime\)'; then
              echo "::error::$bin 缺少 hardened runtime（签名 flags 里没有 runtime）"
              exit 1
            fi
          done
          echo 'codeg-server / codeg-mcp / codeg-cli / codeg-computer-helper 已用自签名证书签名并通过严格验签。'
          "$dir/codeg-server" --version

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp src-tauri/target/${{ matrix.target }}/release/codeg-server dist/${{ matrix.artifact }}/
          cp src-tauri/target/${{ matrix.target }}/release/codeg-mcp dist/${{ matrix.artifact }}/
          cp src-tauri/target/${{ matrix.target }}/release/codeg-computer-helper dist/${{ matrix.artifact }}/
          cp src-tauri/target/${{ matrix.target }}/release/codeg-cli dist/${{ matrix.artifact }}/
          chmod +x dist/${{ matrix.artifact }}/codeg-server dist/${{ matrix.artifact }}/codeg-mcp dist/${{ matrix.artifact }}/codeg-computer-helper dist/${{ matrix.artifact }}/codeg-cli
          cp -r out dist/${{ matrix.artifact }}/web
          cd dist && tar czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.artifact }}
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-server.exe dist/${{ matrix.artifact }}/
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-mcp.exe dist/${{ matrix.artifact }}/
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-computer-helper.exe dist/${{ matrix.artifact }}/
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-cli.exe dist/${{ matrix.artifact }}/
          Copy-Item -Recurse out dist/${{ matrix.artifact }}/web
          Compress-Archive -Path dist/${{ matrix.artifact }} -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Smoke test packaged artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          test -x "dist/${{ matrix.artifact }}/codeg-server"
          test -x "dist/${{ matrix.artifact }}/codeg-mcp"
          test -x "dist/${{ matrix.artifact }}/codeg-computer-helper"
          test -x "dist/${{ matrix.artifact }}/codeg-cli"
          # `codeg-mcp --help` exits 0 without flags and prints the usage
          # line. Only run it for native targets; cross-compiled arm64
          # binaries on x64 runners can't execute.
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] || \
             [ "${{ matrix.target }}" = "x86_64-apple-darwin" ] || \
             [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            "dist/${{ matrix.artifact }}/codeg-mcp" --help | grep -F 'codeg-mcp --parent-connection-id'
            "dist/${{ matrix.artifact }}/codeg-cli" --version | grep -F 'codeg-cli '
            "dist/${{ matrix.artifact }}/codeg-cli" --help | grep -F 'Usage: codeg-cli'
          else
            echo "skipping codeg-mcp --help and codeg-cli --version on cross-target ${{ matrix.target }}"
          fi

      - name: Smoke test packaged artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-server.exe")) {
            throw "codeg-server.exe missing from packaged artifact"
          }
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-mcp.exe")) {
            throw "codeg-mcp.exe missing from packaged artifact"
          }
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-computer-helper.exe")) {
            throw "codeg-computer-helper.exe missing from packaged artifact"
          }
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-cli.exe")) {
            throw "codeg-cli.exe missing from packaged artifact"
          }
          $help = & "dist/${{ matrix.artifact }}/codeg-mcp.exe" --help
          if ($help -notlike "*codeg-mcp --parent-connection-id*") {
            throw "codeg-mcp --help output unexpected: $help"
          }
          # A console program: its help comes back on stdout, named as the
          # docs name it (no `.exe`).
          $cliHelp = (& "dist/${{ matrix.artifact }}/codeg-cli.exe" --help) -join "`n"
          if ($cliHelp -notlike "*Usage: codeg-cli*") {
            throw "codeg-cli --help output unexpected: $cliHelp"
          }

      - name: Upload artifact for Docker build (Linux only)
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 1

      # 完整性校验文件与 minisign 签名（.sig）一起发布；SHA256 只做完整性校验。
      - name: 生成服务器包完整性校验（Unix）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/${{ matrix.artifact }}.tar.gz"
          ( cd dist && shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256" )
          echo 'SHA256 仅为完整性校验；身份认证以同名 .sig（minisign）为准。'

      - name: 生成服务器包完整性校验（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $file = "dist/${{ matrix.artifact }}.zip"
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw '缺少服务器压缩包' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Set-Content -Encoding ascii -LiteralPath "$file.sha256"
          Write-Host 'SHA256 仅为完整性校验；身份认证以同名 .sig（minisign）为准。'

      # 与桌面 updater 同一把 minisign 密钥：服务器自更新安装前会校验
      # `<包名>.sig`（见 src-tauri/src/update/verify.rs），缺签名不得发布。
      # 可信注释里的 version 必须来自已解析发布标签。workflow_dispatch 的
      # GITHUB_REF_NAME 是 main，不能拿来签名；标签推送时两者一致。
      - name: 用更新签名密钥签服务器包（Unix）
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ needs.create-draft-release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::缺少 Secret TAURI_SIGNING_PRIVATE_KEY：拒绝发布未签名服务器包。"
            exit 1
          fi
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$(node -p 'require("./package.json").version')"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::发布标签不是 SemVer，拒绝签名：$RELEASE_TAG"
            exit 1
          fi
          file="dist/${{ matrix.artifact }}.tar.gz"
          test -s "$file"
          pnpm tauri signer sign --app-version "${RELEASE_TAG#v}" "$file"
          test -s "$file.sig"
          node -e 'const fs = require("node:fs"); const decode = text => Buffer.from(Buffer.from(text.trim(), "base64").toString("utf8").split(/\r?\n/)[1], "base64"); const key = decode(JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).plugins.updater.pubkey); const sig = decode(fs.readFileSync(process.argv[1], "utf8")); if (key.length !== 42 || sig.length !== 74 || !key.subarray(2, 10).equals(sig.subarray(2, 10))) throw new Error("签名 key ID 与客户端公钥不匹配，拒绝发布"); console.log("签名 key ID 与客户端公钥一致")' "$file.sig"
          node -e 'const fs = require("node:fs"); const [file, version] = process.argv.slice(1); const text = Buffer.from(fs.readFileSync(file, "utf8").trim(), "base64").toString("utf8"); const line = text.split(/\r?\n/).find(line => line.startsWith("trusted comment: ")); if (!line?.split("\t").includes(`version:${version}`)) throw new Error(`签名可信注释缺少 version:${version}`); console.log(line)' "$file.sig" "${RELEASE_TAG#v}"
          echo "已生成签名：$file.sig（version:${RELEASE_TAG#v}）"

      - name: 用更新签名密钥签服务器包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ needs.create-draft-release.outputs.tag }}
        run: |
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "缺少 Secret TAURI_SIGNING_PRIVATE_KEY：拒绝发布未签名服务器包。"
            exit 1
          }
          if ([string]::IsNullOrEmpty($env:RELEASE_TAG)) {
            $env:RELEASE_TAG = 'v' + (node -p 'require("./package.json").version')
          }
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$') {
            Write-Error "发布标签不是 SemVer，拒绝签名：$env:RELEASE_TAG"
            exit 1
          }
          $file = "dist/${{ matrix.artifact }}.zip"
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "缺少服务器压缩包" }
          $version = $env:RELEASE_TAG.Substring(1)
          pnpm tauri signer sign --app-version $version $file
          if (-not (Test-Path -LiteralPath "$file.sig" -PathType Leaf)) { throw "缺少签名文件 $file.sig" }
          node -e 'const fs = require("node:fs"); const decode = text => Buffer.from(Buffer.from(text.trim(), "base64").toString("utf8").split(/\r?\n/)[1], "base64"); const key = decode(JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).plugins.updater.pubkey); const sig = decode(fs.readFileSync(process.argv[1], "utf8")); if (key.length !== 42 || sig.length !== 74 || !key.subarray(2, 10).equals(sig.subarray(2, 10))) throw new Error("签名 key ID 与客户端公钥不匹配，拒绝发布"); console.log("签名 key ID 与客户端公钥一致")' "$file.sig"
          if ($LASTEXITCODE -ne 0) { throw "签名 key ID 与客户端公钥校验失败" }
          node -e 'const fs = require("node:fs"); const [file, version] = process.argv.slice(1); const text = Buffer.from(fs.readFileSync(file, "utf8").trim(), "base64").toString("utf8"); const line = text.split(/\r?\n/).find(line => line.startsWith("trusted comment: ")); if (!line?.split("\t").includes(`version:${version}`)) throw new Error(`签名可信注释缺少 version:${version}`); console.log(line)' "$file.sig" $version
          if ($LASTEXITCODE -ne 0) { throw "签名可信注释版本校验失败" }
          Write-Host "已生成签名：$file.sig（version:$version）"

      - name: 上传服务器压缩包与完整性校验文件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-package
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256
            dist/${{ matrix.artifact }}.tar.gz.sig
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.zip.sha256
            dist/${{ matrix.artifact }}.zip.sig
          if-no-files-found: error

      - name: 检出当前发布上传脚本
        if: needs.create-draft-release.outputs.release_id != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts/upload-release-assets.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Upload to release (Unix)
        if: runner.os != 'Windows' && needs.create-draft-release.outputs.release_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
        run: |
          node .release-tools/scripts/upload-release-assets.mjs \
            "dist/${{ matrix.artifact }}.tar.gz" \
            "dist/${{ matrix.artifact }}.tar.gz.sha256" \
            "dist/${{ matrix.artifact }}.tar.gz.sig"

      - name: Upload to release (Windows)
        if: runner.os == 'Windows' && needs.create-draft-release.outputs.release_id != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
        run: node .release-tools/scripts/upload-release-assets.mjs "dist/${{ matrix.artifact }}.zip" "dist/${{ matrix.artifact }}.zip.sha256" "dist/${{ matrix.artifact }}.zip.sig"

      # cleanup 在 always() 阶段还原 keychain 搜索列表并删除本 job 的临时
      # keychain；失败路径也要执行。
      - name: 清理临时签名 keychain（macOS 服务器）
        if: always() && contains(matrix.target, 'apple-darwin')
        shell: bash
        run: bash scripts/import-macos-self-signed-certificate.sh cleanup

  generate-updater-manifest:
    needs:
      - create-draft-release
      - build-tauri
      - build-server
    name: Generate updater manifest
    if: ${{ !cancelled() && needs.create-draft-release.outputs.release_id != '' && needs.build-tauri.result == 'success' && needs.build-server.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 该 job 只读 draft release 资产并运行 workflow 自带脚本，与待发布源码
          # 无关；固定检出触发本次运行的 commit，使 dispatch 旧 tag 时也用修复后
          # 的生成器（tag 源码里仍是旧脚本），tag 本身不动。
          ref: ${{ github.sha }}

      - name: 汇总 updater 清单并执行签名门禁
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-draft-release.outputs.tag }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
        run: |
          set -euo pipefail
          # 草稿发布不创建 git tag，releases/tags/{tag} 接口不解析草稿，因此按
          # release_id 查询。tag 与 tauri.conf.json 版本的一致性已在
          # create-draft-release 校验，去掉 v 前缀即为 latest.json 的 version。
          version="${TAG#v}"
          work="$RUNNER_TEMP/codeg-updater"
          rm -rf "$work"
          mkdir -p "$work/sigs"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$work/release.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" | jq 'add' > "$work/assets.json"
          jq --slurpfile assets "$work/assets.json" '.assets = $assets[0]' "$work/release.json" > "$work/complete.json"
          mv "$work/complete.json" "$work/release.json"
          # 草稿资产不走浏览器直链：用 assets API（Accept: application/octet-stream）
          # 把全部 .sig 下载到 sigs 目录，供生成器读取签名文本。
          while IFS=$'\t' read -r asset_id asset_name; do
            [ -n "$asset_id" ] || continue
            curl -sSfL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              -o "$work/sigs/$asset_name"
            echo "已下载签名：$asset_name"
          done < <(
            jq -r '.assets[] | select(.name | endswith(".sig")) | "\(.id)\t\(.name)"' "$work/release.json"
          )
          node scripts/generate-updater-manifest.mjs \
            --release-json "$work/release.json" \
            --sig-dir "$work/sigs" \
            --version "$version" \
            --out "$work/latest.json"
          node scripts/upload-release-assets.mjs "$work/latest.json"
          echo "latest.json 已上传到发布 #$RELEASE_ID"

  build-docker:
    needs:
      - create-draft-release
      - build-server
    name: Build Docker image
    if: needs.create-draft-release.outputs.release_id != ''
    runs-on: ubuntu-22.04
    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-draft-release.outputs.source_ref }}

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: beecode-server-linux-x64
          path: artifacts/linux-x64

      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: beecode-server-linux-arm64
          path: artifacts/linux-arm64

      - name: Prepare Docker build context
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64
          cp artifacts/linux-x64/codeg-server dist/amd64/codeg-server
          cp artifacts/linux-x64/codeg-mcp dist/amd64/codeg-mcp
          cp artifacts/linux-x64/codeg-cli dist/amd64/codeg-cli
          cp artifacts/linux-arm64/codeg-server dist/arm64/codeg-server
          cp artifacts/linux-arm64/codeg-mcp dist/arm64/codeg-mcp
          cp artifacts/linux-arm64/codeg-cli dist/arm64/codeg-cli
          cp -r artifacts/linux-x64/web dist/web
          chmod +x dist/amd64/codeg-server dist/amd64/codeg-mcp dist/amd64/codeg-cli \
                   dist/arm64/codeg-server dist/arm64/codeg-mcp dist/arm64/codeg-cli
          # Fail fast if any companion went missing — Docker would otherwise
          # produce an image where delegation silently degrades, or without
          # the codeg-cli its docs promise.
          for f in dist/amd64/codeg-mcp dist/arm64/codeg-mcp dist/amd64/codeg-cli dist/arm64/codeg-cli; do
            test -x "$f" || { echo "FATAL: $f missing or non-exec"; exit 1; }
          done

      - name: Set up QEMU (for multi-arch manifest)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The image runs its codeg-cli before it is pushed: an amd64 build loaded
      # into the runner's daemon, `codeg-cli --version` inside it.
      - name: Smoke test the image's codeg-cli (amd64)
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load -t codeg-smoke:local -f Dockerfile.ci .
          docker run --rm codeg-smoke:local codeg-cli --version | grep -F 'codeg-cli '
          docker run --rm codeg-smoke:local codeg-cli --help | grep -F 'Usage: codeg-cli'

      - name: 规范化 Docker 版本与镜像路径
        id: version
        shell: bash
        env:
          TAG: ${{ needs.create-draft-release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # SemVer 不允许下划线，用双下划线映射元数据分隔符，避免与预发布标签冲突。
          version="${TAG#v}"
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "version=${version//+/__}" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Docker 版本：${version//+/__}；镜像：$image"

      # `latest` is the newest stable release. A release candidate goes out
      # under its own version only, so nothing that pulls `latest` is moved
      # onto it; the line that would name `latest` is left empty, and
      # build-push-action skips empty lines.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_ENABLED == 'true' && format('{0}/beecode:{1}', secrets.DOCKERHUB_USERNAME, steps.version.outputs.version) || '' }}
            ${{ needs.create-draft-release.outputs.prerelease != 'true' && format('{0}:latest', steps.version.outputs.image) || '' }}
            ${{ env.DOCKERHUB_ENABLED == 'true' && needs.create-draft-release.outputs.prerelease != 'true' && format('{0}/beecode:latest', secrets.DOCKERHUB_USERNAME) || '' }}

  publish-release:
    needs:
      - create-draft-release
      - build-tauri
      - build-server
      - build-docker
      - generate-updater-manifest
    if: ${{ !cancelled() && needs.create-draft-release.outputs.release_id != '' && needs.build-tauri.result == 'success' && needs.build-server.result == 'success' && needs.build-docker.result == 'success' && needs.generate-updater-manifest.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Publish draft release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
          TAG: ${{ needs.create-draft-release.outputs.tag }}
          PRERELEASE: ${{ needs.create-draft-release.outputs.prerelease }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            const prerelease = process.env.PRERELEASE === "true";

            const { expectedAssets, expectedReleaseAssets } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/generate-updater-manifest.mjs`
            );
            const { data: release } = await github.rest.repos.getRelease({
              owner, repo, release_id: releaseId,
            });
            if (!release.draft || release.tag_name !== process.env.TAG) {
              throw new Error(`发布 #${releaseId} 的草稿状态或标签不匹配，拒绝发布。`);
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: releaseId, per_page: 100,
            });
            core.info(`发布 #${releaseId} 实际资产 ${assets.length} 个：${assets.map((a) => a.name).join(", ")}`);
            const version = process.env.TAG.slice(1);
            for (const name of expectedReleaseAssets(version)) {
              const matches = assets.filter((asset) => asset.name === name);
              if (matches.length !== 1 || matches[0].state !== "uploaded" || matches[0].size <= 0) {
                throw new Error(`发布 #${releaseId} 缺少有效资产：${name}`);
              }
            }

            // 按当前发布的资产 ID 读取内容，避免草稿下载 URL 或同标签发布歧义。
            const expected = expectedAssets(version);
            const contents = new Map();
            for (const name of ["latest.json", ...new Set(Object.values(expected).map((name) => `${name}.sig`))]) {
              const asset = assets.find((asset) => asset.name === name);
              const { data } = await github.rest.repos.getReleaseAsset({
                owner, repo, asset_id: asset.id,
                headers: { accept: "application/octet-stream" },
              });
              contents.set(name, Buffer.from(data).toString("utf8").trim());
            }
            const manifest = JSON.parse(contents.get("latest.json"));
            if (manifest?.version !== version) {
              throw new Error("latest.json 版本与发布标签不一致，拒绝发布。");
            }
            if (JSON.stringify(Object.keys(manifest.platforms ?? {}).sort()) !== JSON.stringify(Object.keys(expected).sort())) {
              throw new Error("latest.json 平台集合与预期不一致，拒绝发布。");
            }
            for (const [platform, name] of Object.entries(expected)) {
              const entry = manifest.platforms[platform];
              const url = `https://github.com/${owner}/${repo}/releases/download/${process.env.TAG}/${name}`;
              if (entry?.url !== url) {
                throw new Error(`latest.json 平台 ${platform} 的 URL 与当前仓库、标签或资产不一致。`);
              }
              const signature = contents.get(`${name}.sig`);
              if (!signature || entry.signature !== signature) {
                throw new Error(`latest.json 平台 ${platform} 的签名与 ${name}.sig 内容不一致。`);
              }
            }
            core.info(`latest.json 内容一致性检查通过：版本 ${version}，平台 ${Object.keys(expected).length} 个；未执行密码学验签。`);

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              draft: false,
              prerelease,
            });

            core.info(`已发布 #${releaseId}：latest.json 与 .sig 已就位；beta（预发布）不经 releases/latest 分发。`);
